nombre: "Guerra Civil"
codigo: "MCU-2016"
estado: "Finalizada"
descripcion: >
  Tras los Acuerdos de Sokovia, los Vengadores se dividen en dos bandos: liderados por
  Iron Man (a favor del registro) y el Capitán América (en contra). La lucha interna
  lleva a enfrentamientos directos.
objetivos:
  - (Bando de Tony) Capturar a Steve Rogers y sus seguidores.
  - (Bando de Steve) Evitar el registro y proteger a Bucky Barnes.
heroes_involucrados:
  - Iron Man
  - Capitán América
  - Spider-Man (bando de Tony)
  - Ant-Man (bando de Steve)
villanos_involucrados:
  - Helmut Zemo (manipulador tras bambalinas)
recompensa: "Depende del bando: control gubernamental o libertad individual"